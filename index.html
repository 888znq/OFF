    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

      const IMGBB_API_KEY = "c6cb2a9badd0a53af93636523c72211e";
  
      const firebaseConfig = {
        apiKey: "AIzaSyAYHA8Qw3Qw3Qzbyg8MtjrSKcJusNi4VaA6V4",
        authDomain: "system-data-bf026.firebaseapp.com",
        databaseURL: "https://system-data-bf026-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "system-data-bf026",
        storageBucket: "system-data-bf026.firebasestorage.app",
        messagingSenderId: "718302899022",

      };
  
      const fbApp = initializeApp(firebaseConfig);
      const db = getDatabase(fbApp);
      const IMGBB_UPLOAD = `https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`;
      const ROOT = "organiser";
  
      window.fileSync = {
        uploadFile: (file, folder, onProgress) => new Promise((resolve, reject) => {
          const metaRef = push(dbRef(db, `${ROOT}/files`));
          const id = metaRef.key;
          const form = new FormData();
                    form.append("image", file);
                    const xhr = new XMLHttpRequest();
                    xhr.open("POST", IMGBB_UPLOAD);
                    xhr.upload.onprogress = (e) => { if (onProgress && e.lengthComputable) onProgress(e.loaded / e.total); };
                    xhr.onerror = () => reject(new Error("Network error during upload"));
                    xhr.onload = async () => {
                      try {
                        const res = JSON.parse(xhr.responseText);
                        if (!res.success) throw new Error("ImgBB upload failed");
                        const url = res.data.url;
                        const record = { id, name: file.name, size: file.size, type: file.type || "", url, path: "", folder: folder || "", created: Date.now() };
                        await set(metaRef, record);
                        resolve(record);
                      } catch (err) { reject(err); }
                    };
                    xhr.send(form);
        }),
  
        listenFiles: (callback) => onValue(dbRef(db, `${ROOT}/files`), (snap) => {
          const data = snap.val() || {};
          callback(Object.values(data).sort((a, b) => b.created - a.created));
        }),
  
        renameFile: (id, name) => update(dbRef(db, `${ROOT}/files/${id}`), { name }),
        
                setColor: (id, color) => update(dbRef(db, `${ROOT}/files/${id}`), { color: color || null }),
  
        moveFile: (id, folder) => update(dbRef(db, `${ROOT}/files/${id}`), { folder }),
  
        deleteFile: async (record) => {
          if (!record || !record.id) return;
          await remove(dbRef(db, `${ROOT}/files/${record.id}`));
        }
      };
    const sectionsEl = document.getElementById("sections");
        const newHeaderEl = document.getElementById("new-header");

        const els = {};
        let sectionsData = {};

            function closeViewer() {

            document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !viewer.hidden) closeViewer(); });
        
            function openViewer(f) {
              const imgExt = /\.(jpe?g|png|gif|webp|svg|avif|bmp)(\?|$)/i;
              const isImg = (f.type || "").startsWith("image/") || imgExt.test(f.url || "") || imgExt.test(f.name || "");
              if (!isImg) { window.open(f.url, "_blank", "noopener"); return; }
              viewerImg.src = f.url;
              viewerImg.alt = f.name || "";
              viewer.hidden = false;
            }
        
            function fmtSize(n) {
          if (n < 1024) return `${n} B`;
          if (n < 1048576) return `${(n / 1024).toFixed(1)} KB`;
          return `${(n / 1048576).toFixed(1)} MB`;
        }
    
        async function downloadFile(f) {
                  var handle = null;
                  if (window.showSaveFilePicker) {
                    try {
                      handle = await window.showSaveFilePicker({ suggestedName: f.name || "file" });
                    } catch (err) {
                      if (err && err.name === "AbortError") return;
                      handle = null;
                    }
                  }
                  try {
                    var res = await fetch(f.url);
                    var blob = await res.blob();
                                if (handle) {
                                  var writable = await handle.createWritable();
                                  await writable.write(blob);
                                  await writable.close();
                                  return;
                                }
                    var objUrl = URL.createObjectURL(blob);
                    var link = document.createElement("a");
                    link.href = objUrl;
                    link.download = f.name || "file";
                    document.body.appendChild(link);
                    link.click();
                    link.remove();
                    setTimeout(function () { URL.revokeObjectURL(objUrl); }, 1000);
                  } catch (err) {
                    console.error(err);
                    window.open(f.url, "_blank", "noopener");
                  }
                }
        
                function cleanHtml(html) {
                          var tpl = document.createElement("template");

                          var wrap = document.createElement("div");
                          var walk = function (node, out) {
                            node.childNodes.forEach(function (n) {
                              if (n.nodeType === 3) {
                                out.appendChild(document.createTextNode(n.nodeValue));
                              } else if (n.nodeType === 1) {
                                var tag = n.tagName;
                                var target = out;
                                if (tag === "BR") {
                                  var pt = n.parentNode ? n.parentNode.tagName : "";
                                  if ((pt === "DIV" || pt === "P") && n.parentNode.childNodes.length === 1) { return; }
                                  out.appendChild(document.createElement("br"));
                                  return;
                                }
                                if ((tag === "SPAN" || tag === "FONT") && (/74,\s*222,\s*128/.test((n.style && n.style.color) || "") || (n.getAttribute("color") || "").toLowerCase() === "#4ade80")) {
                                  target = document.createElement("span");
                                  target.className = "g";
                                  out.appendChild(target);
                                } else if ((tag === "DIV" || tag === "P") && out.lastChild) {
                                  out.appendChild(document.createElement("br"));
                                }
                                walk(n, target);
                              }
                            });
                          };
                          walk(tpl.content, wrap);
                          return wrap.innerHTML;
                        }
                
                        function detailsPayload(el) {
                          var txt = (el.innerText || "").replace(/\u00a0/g, " ");
                          if (!txt.trim()) { return { details: "", detailsHtml: "" }; }
                          return { details: txt, detailsHtml: cleanHtml(el.innerHTML) };
                        }
                
                        function buildSection(id) {
          const box = document.createElement("section");
          box.className = "section";
          box.innerHTML = `
            <div class="section-head">
              <div class="cell c-title"><input class="s-title" type="text" aria-label="Header">
                            <button type="button" class="s-col" data-f="title" title="Text color: green / red / none" aria-label="Text color"></button></div>
              <button type="button" class="s-del" title="Delete header" aria-label="Delete header">Delete</button>
            </div>
            <div class="cell c-details"><div class="s-details" tabindex="0" contenteditable="true" role="textbox" data-ph="Write details here" aria-label="Details"></div>
                        <button type="button" class="s-col" data-f="details" title="Text color: green / red / none" aria-label="Text color"></button></div>
                        <div class="cell c-email"><input class="s-email" type="email" placeholder="Email" aria-label="Email">
                                    <button type="button" class="s-col" data-f="email" title="Text color: green / red / none" aria-label="Text color"></button></div>
                        <div class="cell c-mobile"><input class="s-mobile" type="tel" placeholder="Mobile number" aria-label="Mobile number">
                                    <button type="button" class="s-col" data-f="mobile" title="Text color: green / red / none" aria-label="Text color"></button></div>
            <div class="soft"><div class="soft-h"><span>Soft copy</span><button type="button" class="s-add-file" title="Add files" aria-label="Add files">Add files</button></div><div class="files"></div><button type="button" class="s-edit" title="Edit" aria-label="Edit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button><button type="button" class="s-col" data-f="soft" title="Text color: green / red" aria-label="Text color"></button></div>
                        <button type="button" class="s-hard" aria-pressed="false" title="Hard copy (on / off)" aria-label="Hard copy">Hard copy</button>
                        
            <div class="file-actions"><span class="s-status"></span></div>
            <input class="s-picker" type="file" multiple hidden>`;
          const r = {
            box,
            title: box.querySelector(".s-title"),
            details: box.querySelector(".s-details"),
                        email: box.querySelector(".s-email"),
                        mobile: box.querySelector(".s-mobile"),
                                    
                                                                        hard: box.querySelector(".s-hard"),
                                                                                                            soft: box.querySelector(".soft"),
                                                dots: box.querySelectorAll(".s-col"),
            files: box.querySelector(".files"),
            status: box.querySelector(".s-status"),
            picker: box.querySelector(".s-picker")
          };
          const secRef = dbRef(db, `${SECTIONS}/${id}`);
          let timer = null;
          let gone = false;
    
          const saveDetails = () => {
            clearTimeout(timer);
            if (gone) return;
            update(secRef, detailsPayload(r.details)).catch(console.error);
          };
          r.title.addEventListener("change", () => {
            const t = r.title.value.trim();
            if (t) { update(secRef, { title: t }).catch(console.error); }
            else { r.title.value = (sectionsData[id] && sectionsData[id].title) || ""; }
          });
          r.details.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(saveDetails, 500); });
          r.details.addEventListener("blur", saveDetails);
                    r.details.addEventListener("input", () => { if (!r.details.textContent) { r.details.innerHTML = ""; } });
                    r.details.addEventListener("paste", (e) => { e.preventDefault(); var pasted = (e.clipboardData || window.clipboardData).getData("text/plain"); document.execCommand("insertText", false, pasted); });
                    r.dots.forEach((b) => {
                                b.addEventListener("click", () => {
                                  var cur = (sectionsData[id] && sectionsData[id].colors && sectionsData[id].colors[b.dataset.f]) || "";
                                  update(secRef, { ["colors/" + b.dataset.f]: (cur === "g" ? "r" : "g") }).catch(console.error);
                                });
                              });
                    r.email.addEventListener("change", () => { if (!gone) update(secRef, { email: r.email.value.trim() }).catch(console.error); });
                                        var flipColor = (e) => {
                                                              return;
                                                              var t = e.target;
                                                              if (t.closest("button, .file-rename")) return;
                                                              var btn = null;
                                                              ["title", "details", "email", "mobile"].forEach((k) => { if (r[k].contains(t)) btn = box.querySelector('.s-col[data-f="' + k + '"]'); });
                                                              var fr = t.closest(".file");
                                                              if (fr) btn = fr.querySelector(".s-col");
                                                              if (!btn) return;
                                                              e.preventDefault();
                                                              e.stopPropagation();
                                                              if (e.type === "click") btn.click();
                                                            };
                                                            box.addEventListener("mousedown", flipColor, true);
                                                            box.addEventListener("click", flipColor, true);
                    r.mobile.addEventListener("change", () => { if (!gone) update(secRef, { mobile: r.mobile.value.trim() }).catch(console.error); });
                                        r.hard.addEventListener("click", () => { if (gone) return; update(secRef, { hardCopy: !(sectionsData[id] && sectionsData[id].hardCopy) }).catch(console.error); });
    
          box.querySelector(".s-add-file").addEventListener("click", () => r.picker.click());
                    box.querySelector(".s-edit").addEventListener("click", () => { box.classList.toggle("editing"); });
                              
          r.picker.addEventListener("change", async () => {
            const list = Array.from(r.picker.files);
            r.picker.value = "";
            let failed = "";
            for (const f of list) {
              try {
                await window.fileSync.uploadFile(f, id, (p) => { r.status.textContent = `Uploading ${f.name} ${Math.round(p * 100)}%`; });
              } catch (err) {
                console.error(err);
                failed = f.name;
              }
            }
            r.status.textContent = failed ? `Upload failed: ${failed}` : "";
          });
    
          const delBtn = box.querySelector(".s-del");
          let armed = false;
          delBtn.addEventListener("click", async () => {
            if (false) {
              armed = true;
              delBtn.textContent = "Tap again to delete";
                            delBtn.classList.add("armed");
              setTimeout(() => { armed = false; delBtn.textContent = "Delete"; delBtn.classList.remove("armed"); }, 3000);
              return;
            }
            gone = true;
            clearTimeout(timer);
            try {
              const mine = filesData.filter((f) => f.folder === id);
              for (const f of mine) { await window.fileSync.deleteFile(f); }
              await remove(secRef);
            } catch (err) {
              gone = false;
              armed = false;
              delBtn.textContent = "Delete";
              delBtn.classList.remove("armed");
                            r.status.textContent = "Delete failed. Try again.";
              console.error(err);
            }
          });
          return r;
        }
    
        function renderFiles(r, id) {
          r.files.textContent = "";
          filesData.filter((f) => f.folder === id).sort((x, y) => (x.created || 0) - (y.created || 0)).forEach((f, fi) => {
            const row = document.createElement("div");
            row.className = "file";
            const a = document.createElement("a");
            a.href = f.url;
            a.target = "_blank";
            a.rel = "noopener";
                        a.addEventListener("click", (e) => { e.preventDefault(); openViewer(f); });
            a.textContent = String(fi + 1);
                        var dot = document.createElement("button");
                        dot.type = "button";
                        dot.className = "s-col";
                        dot.title = "Text color: green / red / none";
                        dot.setAttribute("aria-label", "Text color");
                        dot.dataset.c = f.color || "r";
                        a.dataset.c = f.color || "r";
                        dot.addEventListener("click", () => { window.fileSync.setColor(f.id, f.color === "g" ? "r" : "g").catch(console.error); });
            const small = document.createElement("small");
            small.textContent = fmtSize(f.size || 0);
            const del = document.createElement("button");
            del.type = "button";
            del.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg>`;
                        del.title = "Remove";
                        del.setAttribute("aria-label", "Remove");
                        del.className = "icon-btn";
            del.addEventListener("click", async () => {
              try { await window.fileSync.deleteFile(f); }
              catch (err) { console.error(err); r.status.textContent = `Could not remove ${f.name}`; }
            });
            const view = document.createElement("button");
                        view.type = "button";
                        view.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
                                                view.title = "Download";
                                                view.setAttribute("aria-label", "Download");
                                                view.className = "icon-btn";
                        view.addEventListener("click", () => downloadFile(f));
                        const ren = document.createElement("button");
                        ren.type = "button";
                        ren.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>`;
                                                ren.title = "Rename";
                                                ren.setAttribute("aria-label", "Rename");
                                                ren.className = "icon-btn";
                        ren.addEventListener("click", () => {
                          const inp = document.createElement("input");
                          inp.type = "text";
                          inp.value = f.name;
                          inp.className = "file-rename";
                          inp.setAttribute("aria-label", "File name");
                          a.replaceWith(inp);
                          inp.focus();
                          inp.select();
                          let done = false;
                          const finish = async (save) => {
                            if (done) return;
                            done = true;
                            const nm = inp.value.trim();
                            if (save && nm && nm !== f.name) {
                              try { await window.fileSync.renameFile(f.id, nm); }
                              catch (err) { console.error(err); r.status.textContent = `Could not rename ${f.name}`; }
                            }
                            inp.replaceWith(a);
                          };
                          inp.addEventListener("keydown", (e) => {
                            if (e.key === "Enter") finish(true);
                            if (e.key === "Escape") finish(false);
                          });
                          inp.addEventListener("blur", () => finish(true));
                        });
                        row.append(a, dot, small, ren, view, del);
            r.files.appendChild(row);
          });
        }
    
        function render() {
          const ids = Object.keys(sectionsData).sort((a, b) => (sectionsData[a].created || 0) - (sectionsData[b].created || 0));
          Object.keys(els).forEach((id) => {
            if (!sectionsData[id]) { els[id].box.remove(); delete els[id]; }
          });
          emptyEl.hidden = ids.length > 0;
          ids.forEach((id) => {
            if (!els[id]) { els[id] = buildSection(id); sectionsEl.appendChild(els[id].box); }
            const r = els[id];
            const s = sectionsData[id];
            if (document.activeElement !== r.title) r.title.value = s.title || "";
            if (document.activeElement !== r.details) {
                          if (s.detailsHtml != null) { r.details.innerHTML = cleanHtml(s.detailsHtml); }
                          else { r.details.textContent = s.details || ""; }
                        }
                        if (document.activeElement !== r.email) r.email.value = s.email || "";
                                                var nLines = (s.details || "").split("\n").filter(function (x) { return x.trim(); }).length;
                                                if (nLines > 1) { r.details.parentNode.dataset.more = "+" + (nLines - 1); } else { delete r.details.parentNode.dataset.more; }
                        if (document.activeElement !== r.mobile) r.mobile.value = s.mobile || "";
                                    r.box.classList.toggle("locked", !!s.locked);
                                    [r.title, r.email, r.mobile].forEach((x) => { x.readOnly = false; });
                                                r.details.contentEditable = "true";
                                                r.dots.forEach((d) => { var c = (s.colors && s.colors[d.dataset.f]) || "r"; d.dataset.c = c; r[d.dataset.f].dataset.c = c; });
                                    
                                                                        r.hard.classList.toggle("on", !!s.hardCopy);
                                                                        r.hard.setAttribute("aria-pressed", s.hardCopy ? "true" : "false");
                                                                        r.hard.disabled = false;
            renderFiles(r, id);
          });
        }
    
        async function addHeader() {
          const title = newHeaderEl.value.trim();
          if (!title) return;
          newHeaderEl.value = "";
          try {
            await set(push(dbRef(db, SECTIONS)), { title, details: "", created: Date.now() });
          } catch (err) {
            console.error(err);
            newHeaderEl.value = title;
          }
        }
        document.getElementById("add-header").addEventListener("click", addHeader);
                document.getElementById("del-mode").addEventListener("click", function () { var on = document.getElementById("app").classList.toggle("del-mode"); this.setAttribute("aria-pressed", on ? "true" : "false"); });
        newHeaderEl.addEventListener("keydown", (e) => { if (e.key === "Enter") addHeader(); });
    
        onValue(dbRef(db, SECTIONS), (snap) => { sectionsData = snap.val() || {}; render(); });
        window.fileSync.listenFiles((list) => { filesData = list; render(); });
      </script>
